<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a5276">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>경제사회연구원 비용 및 매출 관리</title>
<style>
:root {
  --primary: #1a5276;
  --primary-dark: #154360;
  --primary-light: #2471a3;
  --accent: #2e86c1;
  --bg: #0d1b2a;
  --card-bg: #1a2a3a;
  --card-border: #2c3e50;
  --text: #ecf0f1;
  --text-muted: #95a5a6;
  --green: #27ae60;
  --green-light: #2ecc71;
  --red: #e74c3c;
  --yellow: #f39c12;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── Header ── */
.app-header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
  padding: 16px 20px 20px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.header-top {
  display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
}
.header-icon { font-size: 24px; }
.header-title { font-size: 18px; font-weight: 700; }
.header-subtitle { font-size: 12px; color: rgba(255,255,255,0.7); margin-left: 34px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }
.btn-refresh {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white; border-radius: 8px;
  padding: 6px 12px; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
}
.btn-refresh:hover { background: rgba(255,255,255,0.25); }

/* ── Screen management ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── Summary cards ── */
.summary-bar {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; padding: 16px;
}
.summary-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.summary-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.summary-card .label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.summary-card .value { font-size: 17px; font-weight: 700; color: #5dade2; line-height: 1.2; }
.summary-card .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── Year filter ── */
.section-header {
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.year-pills {
  display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto;
  scrollbar-width: none;
}
.year-pills::-webkit-scrollbar { display: none; }
.year-pill {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: all .15s;
}
.year-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ── Project cards ── */
.projects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; padding: 0 16px 80px;
}
@media(min-width:600px) { .projects-grid { grid-template-columns: repeat(3, 1fr); } }
.project-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
}
.project-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.project-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent-color, var(--accent));
}
.project-icon { font-size: 22px; margin-bottom: 8px; }
.project-name { font-size: 13px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.project-amount { font-size: 15px; font-weight: 700; color: #5dade2; margin-bottom: 4px; }
.project-label { font-size: 11px; color: var(--text-muted); }
.project-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 10px; }
.project-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }
.project-pct { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── Detail screen ── */
.detail-header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  padding: 16px 20px;
  display: flex; align-items: center; gap: 12px;
}
.btn-back {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white; border-radius: 8px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
}
.btn-back:hover { background: rgba(255,255,255,0.25); }
.detail-title { font-size: 17px; font-weight: 700; }
.detail-icon { font-size: 20px; }

/* ── Tabs ── */
.tabs {
  display: flex; background: var(--primary-dark);
  border-bottom: 1px solid var(--card-border);
}
.tab-btn {
  flex: 1; padding: 12px; text-align: center;
  font-size: 13px; font-weight: 600; cursor: pointer;
  color: rgba(255,255,255,0.5);
  border-bottom: 3px solid transparent;
  transition: all .15s;
}
.tab-btn.active { color: white; border-bottom-color: #5dade2; }

/* ── Content areas ── */
.content { padding: 16px; padding-bottom: 80px; }

/* ── Year tabs in detail ── */
.year-tabs {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
}
.year-tab {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  border-radius: 20px; padding: 5px 14px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all .15s;
}
.year-tab.active { background: var(--accent); border-color: var(--accent); color: white; }

/* ── Data table ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  background: var(--primary-dark);
  color: var(--text-muted); font-size: 11px; font-weight: 600;
  padding: 8px 10px; text-align: left;
  border-bottom: 1px solid var(--card-border);
}
.data-table td {
  padding: 9px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  vertical-align: middle;
}
.data-table tr:hover td { background: rgba(255,255,255,0.04); }
.data-table .amount { text-align: right; font-weight: 600; color: #5dade2; font-variant-numeric: tabular-nums; }
.data-table .total-row td { background: var(--primary-dark); font-weight: 700; border-top: 2px solid var(--accent); }
.data-table .total-row .amount { color: #f39c12; font-size: 14px; }

/* ── Info card ── */
.info-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 14px;
  margin-bottom: 14px;
}
.info-card-title {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px;
}
.kpi-row {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px;
}
.kpi { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; text-align: center; }
.kpi .kpi-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.kpi .kpi-value { font-size: 15px; font-weight: 700; color: #5dade2; }

/* ── Budget tag ── */
.tag {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 10px; font-weight: 600;
}
.tag-green { background: rgba(39,174,96,0.2); color: #2ecc71; }
.tag-red { background: rgba(231,76,60,0.2); color: #e74c3c; }
.tag-yellow { background: rgba(243,156,18,0.2); color: #f39c12; }
.tag-blue { background: rgba(46,134,193,0.2); color: #5dade2; }

/* ── Progress bar ── */
.progress-wrap { background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; margin-top: 6px; }
.progress-fill { height: 100%; border-radius: 4px; transition: width .5s; }

/* ── No data ── */
.no-data { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px; }

/* ── Loading ── */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(13,27,42,0.85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; gap: 12px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(93,173,226,0.2);
  border-top-color: #5dade2;
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-muted); font-size: 13px; }

/* ── Company table wrapper ── */
.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--card-border); }

/* ── Scrollable company filter ── */
.company-filter {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
}
.company-filter .c-btn {
  background: var(--card-bg); border: 1px solid var(--card-border);
  color: var(--text-muted); border-radius: 16px; padding: 4px 10px;
  font-size: 11px; cursor: pointer; transition: all .15s;
}
.company-filter .c-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

/* ── Chart bars ── */
.bar-chart { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 11px; color: var(--text-muted); width: 70px; text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; background: rgba(255,255,255,0.06); border-radius: 4px; height: 20px; position: relative; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 10px; font-weight: 600; color: white; white-space: nowrap; transition: width .6s; }
.bar-amount { font-size: 11px; color: var(--text); width: 90px; text-align: right; flex-shrink: 0; font-weight: 600; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">데이터 불러오는 중...</div>
</div>

<!-- ══════════════ MAIN SCREEN ══════════════ -->
<div class="screen active" id="screenMain">
  <div class="app-header">
    <div class="header-top">
      <span class="header-icon">🏛️</span>
      <span class="header-title">경제사회연구원 비용 및 매출 관리</span>

<script>
// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const SHEET_ID = '17Jxg_6fdocR1D55wDd4ssyUmwLQTLSZhu8exzywH518';

const PROJECTS = [
  { id: 'asia',    name: '아시아미래포럼',    icon: '🌏', color: '#2e86c1', sheetName: '아시아미래포럼 매출',    format: 'wide' },
  { id: 'digital', name: '사람과디지털포럼',  icon: '💻', color: '#8e44ad', sheetName: '사람과디지털포럼 매출', format: 'wide' },
  { id: 'energy',  name: '에너지정의포럼',    icon: '⚡', color: '#e67e22', sheetName: '에너지정의포럼',         format: 'energy' },
  { id: 'gov',     name: '기업지배구조',       icon: '🏢', color: '#27ae60', sheetName: '기업지배구조',           format: 'simple' },
  { id: 'region',  name: '지역조사평가사업',   icon: '📋', color: '#16a085', sheetName: '지역조사평가사업',      format: 'simple' },
  { id: 'social',  name: '사회적경제정책포럼', icon: '🤝', color: '#c0392b', sheetName: null, format: null },
  { id: 'dialog',  name: '한국의대화',         icon: '💬', color: '#2980b9', sheetName: null, format: null },
  { id: 'solcon',  name: '사회연대경제 별지',  icon: '🌱', color: '#1abc9c', sheetName: null, format: null },
  { id: 'vote63',  name: '63지방선거심포지엄', icon: '🗳️', color: '#7f8c8d', sheetName: null, format: null },
  { id: 'dliter',  name: '디지털리터러시사업', icon: '📱', color: '#3498db', sheetName: null, format: null },
  { id: 'crypto',  name: '가상자산',           icon: '🪙', color: '#f1c40f', sheetName: null, format: null },
];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let state = {
  budget: {},      // { projectName: { accountKey: { budget, used, remain } } }
  revenues: {},    // { projectId: { year: [{ 기업명, 매출귀속, 매출구분, 매출액 }] } }
  selectedYear: '2026',
  currentProject: null,
  currentDetailYear: null,
  currentTab: 'revenue',
};

// ══════════════════════════════════════════
//  CSV parser
// ══════════════════════════════════════════
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell.trim()); cell = ''; }
      else if (c === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') {}
      else cell += c;
    }
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows;
}

// ══════════════════════════════════════════
//  Number helpers
// ══════════════════════════════════════════
function parseAmt(s) {
  if (!s) return 0;
  return parseInt(String(s).replace(/,/g, ''), 10) || 0;
}
function fmtAmt(n) {
  if (!n && n !== 0) return '-';
  if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1).replace(/\.0$/,'') + '억';
  if (Math.abs(n) >= 1e4) return (n/1e4).toFixed(0) + '만';
  return n.toLocaleString();
}
function fmtAmtFull(n) {
  if (!n && n !== 0) return '-';
  return n.toLocaleString() + '원';
}
function fmtPct(a, b) {
  if (!b) return '-';
  return (a/b*100).toFixed(1) + '%';
}

// ══════════════════════════════════════════
//  Fetch CSV from Google Sheets
// ══════════════════════════════════════════
async function fetchSheet(sheetName, gid) {
  let url;
  if (gid) {
    url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
  } else {
    url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  }
  const res = await fetch(url, { credentials: 'omit' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

// ══════════════════════════════════════════
//  Budget parser (예산편성 sheet)
//  Rows: "계정이름 예산/사용/잔여", Cols: projects
// ══════════════════════════════════════════
function parseBudget(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return {};

  const header = rows[0]; // [계정, 아시아미래포럼, 지역조사평가사업, ...]
  const projects = header.slice(1); // project name columns

  const result = {};
  projects.forEach(p => { if (p) result[p] = {}; });

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const key = row[0]; // e.g. "회의비-기타 예산"
    if (!key) continue;

    // Determine type: 예산/사용/잔여
    let type = null;
    if (key.endsWith(' 예산')) type = 'budget';
    else if (key.endsWith(' 사용')) type = 'used';
    else if (key.endsWith(' 잔여 예산')) type = 'remain';
    if (!type) continue;

    // Account name = key without suffix
    const account = key.replace(/ 예산$/, '').replace(/ 사용$/, '').replace(/ 잔여 예산$/, '');

    for (let j = 1; j < row.length; j++) {
      const proj = projects[j - 1];
      if (!proj || !result[proj]) continue;
      if (!result[proj][account]) result[proj][account] = { budget: 0, used: 0, remain: 0 };
      result[proj][account][type] = parseAmt(row[j]);
    }
  }
  return result;
}

// ══════════════════════════════════════════
//  Wide format parser (아시아미래포럼, 사람과디지털포럼)
//  Header row has year group columns; data rows have company entries
// ══════════════════════════════════════════
function parseWideFormat(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return {};

  const header = rows[0];
  // Find column groups where header matches year pattern (e.g. "11회(2020년) 연도" or "제1회(2022) 연도")
  const yearGroups = [];
  for (let i = 0; i < header.length; i++) {
    const h = header[i];
    const m = h.match(/(\d{4})/);
    if (m && (h.includes('연도') || h.includes('연 도'))) {
      yearGroups.push({ startCol: i, year: m[1], label: h });
    }
  }

  if (!yearGroups.length) return {};

  // For each year group, determine number of data columns
  // Columns after year: 기업명, 매출귀속, 매출구분, 매출액, (+귀속월, 담당자...) , 비고
  // We look for: col+0=year, col+1=기업명, col+2=매출귀속, col+3=매출구분, col+4=매출액
  const result = {};

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    for (const grp of yearGroups) {
      const yr = row[grp.startCol];
      if (!yr || !yr.match(/^\d{4}$/)) continue; // Not a valid year value

      const 기업명 = row[grp.startCol + 1] || '';
      const 매출귀속 = row[grp.startCol + 2] || '';
      const 매출구분 = row[grp.startCol + 3] || '';
      const amtRaw = row[grp.startCol + 4] || '';
      const amt = parseAmt(amtRaw);

      if (!기업명 || !amt) continue;

      if (!result[yr]) result[yr] = [];
      result[yr].push({ 기업명, 매출귀속, 매출구분, 매출액: amt });
    }
  }
  return result;
}

// ══════════════════════════════════════════
//  Energy format parser (에너지정의포럼)
//  Groups: 연도, 회차, 기업명, 매출액, 비고, ""
// ══════════════════════════════════════════
function parseEnergyFormat(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return {};

  const header = rows[0];
  const yearGroups = [];
  for (let i = 0; i < header.length; i++) {
    const h = header[i];
    const m = h.match(/(\d{4})/);
    if (m && (h.includes('연도') || h.includes('회'))) {
      yearGroups.push({ startCol: i, year: m[1] });
    }
  }

  const result = {};
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    for (const grp of yearGroups) {
      const yr = row[grp.startCol];
      if (!yr || !yr.match(/^\d{4}$/)) continue;
      const 기업명 = row[grp.startCol + 2] || '';
      const amtRaw = row[grp.startCol + 3] || '';
      const amt = parseAmt(amtRaw);
      if (!기업명 || !amt) continue;
      if (!result[yr]) result[yr] = [];
      result[yr].push({ 기업명, 매출귀속: '', 매출구분: '', 매출액: amt });
    }
  }
  return result;
}

// ══════════════════════════════════════════
//  Simple format parser (기업지배구조, 지역조사평가사업)
//  Columns: 연도, 기업명/단체명, 매출액, 비고
// ══════════════════════════════════════════
function parseSimpleFormat(csvText) {
  const rows = parseCSV(csvText);
  if (rows.length < 2) return {};
  // Skip header (row 0)
  const result = {};
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const yr = String(row[0] || '').trim();
    if (!yr.match(/^\d{4}$/)) continue;
    const 기업명 = row[1] || '';
    const amt = parseAmt(row[2]);
    if (!기업명 || !amt) continue;
    if (!result[yr]) result[yr] = [];
    result[yr].push({ 기업명, 매출귀속: '', 매출구분: '협찬', 매출액: amt });
  }
  return result;
}

// ══════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════
async function loadData() {
  showLoading('예산 데이터 불러오는 중...');

  try {
    // Load budget
    const budgetCsv = await fetchSheet(null, '851117822');
    state.budget = parseBudget(budgetCsv);

    // Load each project revenue sheet
    showLoading('매출 데이터 불러오는 중...');
    for (const proj of PROJECTS) {
      if (!proj.sheetName) continue;
      try {
        const csv = await fetchSheet(proj.sheetName);
        if (proj.format === 'wide') {
          state.revenues[proj.id] = parseWideFormat(csv);
        } else if (proj.format === 'energy') {
          state.revenues[proj.id] = parseEnergyFormat(csv);
        } else if (proj.format === 'simple') {
          state.revenues[proj.id] = parseSimpleFormat(csv);
        }
      } catch(e) {
        console.warn(`Failed to load ${proj.sheetName}:`, e);
        state.revenues[proj.id] = {};
      }
    }

    hideLoading();
    renderMain();

    const now = new Date();
    document.getElementById('lastUpdated').textContent =
      `마지막 업데이트: ${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})}`;

  } catch(e) {
    hideLoading();
    document.getElementById('lastUpdated').textContent = '데이터 로드 실패 - 새로고침 해주세요';
    console.error(e);
  }
}

function showLoading(text) {
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('loadingText').textContent = text || '로딩 중...';
}
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}
function refreshData() { loadData(); }

// ══════════════════════════════════════════
//  REVENUE HELPERS
// ══════════════════════════════════════════
function getProjectRevByYear(projId, year) {
  const data = state.revenues[projId] || {};
  return data[year] || [];
}
function getProjectTotalByYear(projId, year) {
  return getProjectRevByYear(projId, year).reduce((s, r) => s + r.매출액, 0);
}
function getAllYears(projId) {
  return Object.keys(state.revenues[projId] || {}).sort();
}

// Get budget for a project from the 예산편성 sheet
// The budget sheet uses project display names
function getBudgetForProject(projName) {
  return state.budget[projName] || {};
}

// ══════════════════════════════════════════
//  RENDER MAIN
// ══════════════════════════════════════════
function renderMain() {
  renderYearPills();
  renderProjectCards();
  renderSummary();
}

function renderYearPills() {
  // Collect all years across all projects
  const allYears = new Set();
  allYears.add('2026');
  for (const proj of PROJECTS) {
    for (const yr of getAllYears(proj.id)) allYears.add(yr);
  }
  const years = [...allYears].sort().reverse();

  const el = document.getElementById('mainYearPills');
  el.innerHTML = years.map(yr =>
    `<button class="year-pill ${yr === state.selectedYear ? 'active' : ''}" onclick="selectMainYear('${yr}')">${yr}년</button>`
  ).join('');
}

function selectMainYear(yr) {
  state.selectedYear = yr;
  renderYearPills();
  renderProjectCards();
  renderSummary();
}

function renderSummary() {
  const yr = state.selectedYear;
  // Get 2026 budget goal from budget sheet (sum of all projects' 매출)
  // For now compute from revenue data
  let totalActual = 0;
  for (const proj of PROJECTS) {
    totalActual += getProjectTotalByYear(proj.id, yr);
  }

  // Try to get budget goal from budget data (광고수수료 예산 as proxy)
  let totalGoal = 0;
  for (const proj of PROJECTS) {
    const bdata = getBudgetForProject(proj.name);
    for (const [acct, vals] of Object.entries(bdata)) {
      totalGoal += vals.budget || 0;
    }
    // Also add revenue target... but budget sheet only has costs
  }
  // Since the budget sheet contains cost targets, not revenue targets,
  // let's use total actual + a rough estimate or just show actual
  // The existing app shows 17억 9,409만원 as goal - this must come from a revenue budget row
  // For now: show what we have
  const pct = totalGoal > 0 ? (totalActual/totalGoal*100).toFixed(1) : null;

  document.getElementById('sumGoal').textContent = totalGoal > 0 ? fmtAmt(totalGoal) + '원' : fmtAmt(totalActual) + '원';
  document.getElementById('sumActual').textContent = fmtAmt(totalActual) + '원';
  document.getElementById('sumRate').textContent = pct ? pct + '%' : '-';
  document.getElementById('sumRateSub').textContent = yr + '년 기준';
}

function renderProjectCards() {
  const yr = state.selectedYear;
  const grid = document.getElementById('projectsGrid');

  grid.innerHTML = PROJECTS.map(proj => {
    const total = getProjectTotalByYear(proj.id, yr);
    // Get budget from cost data
    const bdata = getBudgetForProject(proj.name);
    const totalBudget = Object.values(bdata).reduce((s, v) => s + (v.budget||0), 0);
    const totalUsed = Object.values(bdata).reduce((s, v) => s + (v.used||0), 0);

    // For revenue goal, use budget if available
    const hasRevData = proj.sheetName && Object.keys(state.revenues[proj.id] || {}).length > 0;
    const allYrsForProj = getAllYears(proj.id);
    const latestTotal = allYrsForProj.length > 0
      ? getProjectTotalByYear(proj.id, allYrsForProj[allYrsForProj.length - 1])
      : 0;

    const displayAmt = total > 0 ? total : (hasRevData ? 0 : null);
    const pct = displayAmt !== null && latestTotal > 0
      ? Math.min((displayAmt / latestTotal) * 100, 200) : 0;

    const barColor = pct >= 100 ? '#27ae60' : pct >= 50 ? '#f39c12' : '#5dade2';

    return `
      <div class="project-card" onclick="openProject('${proj.id}')" style="--accent-color:${proj.color}">
        <div class="project-icon">${proj.icon}</div>
        <div class="project-name">${proj.name}</div>
        ${displayAmt !== null
          ? `<div class="project-amount">${fmtAmt(displayAmt)}원</div>`
          : `<div class="project-amount" style="color:var(--text-muted)">-</div>`
        }
        <div class="project-label">${yr}년 매출</div>
        <div class="project-bar">
          <div class="project-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div>
        </div>
        ${totalBudget > 0
          ? `<div class="project-pct">비용: ${fmtAmt(totalUsed)}/${fmtAmt(totalBudget)}</div>`
          : `<div class="project-pct">${allYrsForProj.join(', ') || '-'}년 데이터</div>`
        }
      </div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  DETAIL SCREEN
// ══════════════════════════════════════════
function openProject(projId) {
  const proj = PROJECTS.find(p => p.id === projId);
  if (!proj) return;

  state.currentProject = proj;
  state.currentTab = 'revenue';

  document.getElementById('detailIcon').textContent = proj.icon;
  document.getElementById('detailTitle').textContent = proj.name;

  document.getElementById('screenMain').classList.remove('active');
  document.getElementById('screenDetail').classList.add('active');

  switchTab('revenue');
}

function goBack() {
  document.getElementById('screenDetail').classList.remove('active');
  document.getElementById('screenMain').classList.add('active');
  state.currentProject = null;
  window.scrollTo(0, 0);
}

function switchTab(tab) {
  state.currentTab = tab;
  document.getElementById('tabRevBtn').classList.toggle('active', tab === 'revenue');
  document.getElementById('tabCostBtn').classList.toggle('active', tab === 'cost');
  document.getElementById('tabRevenue').style.display = tab === 'revenue' ? 'block' : 'none';
  document.getElementById('tabCost').style.display = tab === 'cost' ? 'block' : 'none';

  if (tab === 'revenue') renderDetailRevenue();
  else renderDetailCost();
}

// ── Revenue detail ──
function renderDetailRevenue() {
  const proj = state.currentProject;
  if (!proj) return;

  const years = getAllYears(proj.id).sort();

  // Default year: most recent
  if (!state.currentDetailYear || !years.includes(state.currentDetailYear)) {
    state.currentDetailYear = years[years.length - 1] || '2026';
  }

  // KPI row
  const totalAllYears = years.reduce((s, y) => s + getProjectTotalByYear(proj.id, y), 0);
  const totalCurYear = getProjectTotalByYear(proj.id, state.currentDetailYear);
  const companies = [...new Set(years.flatMap(y => getProjectRevByYear(proj.id, y).map(r => r.기업명)))];

  document.getElementById('revKpiRow').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">전체 매출 합계</div>
      <div class="kpi-value">${fmtAmt(totalAllYears)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${state.currentDetailYear}년 매출</div>
      <div class="kpi-value">${fmtAmt(totalCurYear)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">참여 기업 수</div>
      <div class="kpi-value">${companies.length}개</div>
    </div>`;

  // Year tabs
  document.getElementById('detailYearTabs').innerHTML = years.map(y =>
    `<button class="year-tab ${y === state.currentDetailYear ? 'active' : ''}" onclick="selectDetailYear('${y}')">${y}년</button>`
  ).join('') || '<div class="no-data">매출 데이터 없음</div>';

  renderCompanyTable();
  renderYearBarChart(years);
}

function selectDetailYear(yr) {
  state.currentDetailYear = yr;
  // Update year tab active state
  document.querySelectorAll('.year-tab').forEach(el => {
    el.classList.toggle('active', el.textContent === yr + '년');
  });
  renderCompanyTable();
}

function renderCompanyTable() {
  const proj = state.currentProject;
  const yr = state.currentDetailYear;
  const rows = getProjectRevByYear(proj.id, yr);
  const total = rows.reduce((s, r) => s + r.매출액, 0);

  const tbody = document.getElementById('companyTableBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="no-data">해당 연도 데이터 없음</div></td></tr>`;
    // Hide specific columns if no attribute data
    return;
  }

  const hasAttr = rows.some(r => r.매출귀속 || r.매출구분);

  // Update header
  const thead = document.querySelector('#companyTable thead tr');
  thead.innerHTML = hasAttr
    ? '<th>기업명</th><th>매출귀속</th><th>매출구분</th><th style="text-align:right">매출액</th>'
    : '<th>기업명</th><th style="text-align:right">매출액</th>';

  tbody.innerHTML = rows.map(r => {
    const pct = total > 0 ? (r.매출액 / total * 100).toFixed(1) : 0;
    return hasAttr ? `
      <tr>
        <td>${r.기업명}</td>
        <td>${r.매출귀속 ? `<span class="tag tag-blue">${r.매출귀속}</span>` : '-'}</td>
        <td>${r.매출구분 ? `<span class="tag tag-green">${r.매출구분}</span>` : '-'}</td>
        <td class="amount">${r.매출액.toLocaleString()}원</td>
      </tr>` : `
      <tr>
        <td>${r.기업명}</td>
        <td class="amount">${r.매출액.toLocaleString()}원</td>
      </tr>`;
  }).join('') + `
    <tr class="total-row">
      ${hasAttr ? '<td colspan="3"><strong>합계</strong></td>' : '<td><strong>합계</strong></td>'}
      <td class="amount">${total.toLocaleString()}원</td>
    </tr>`;
}

function renderYearBarChart(years) {
  const proj = state.currentProject;
  const amounts = years.map(y => getProjectTotalByYear(proj.id, y));
  const maxAmt = Math.max(...amounts, 1);

  document.getElementById('yearBarChart').innerHTML = years.map((y, i) => {
    const amt = amounts[i];
    const w = Math.round(amt / maxAmt * 100);
    return `
      <div class="bar-row">
        <div class="bar-label">${y}년</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${w}%">${w > 15 ? fmtAmt(amt) : ''}</div>
        </div>
        <div class="bar-amount">${fmtAmt(amt)}원</div>
      </div>`;
  }).join('') || '<div class="no-data">연도별 데이터 없음</div>';
}

// ── Cost detail ──
function renderDetailCost() {
  const proj = state.currentProject;
  const bdata = getBudgetForProject(proj.name);
  const accounts = Object.keys(bdata);

  const totalBudget = accounts.reduce((s, a) => s + (bdata[a].budget||0), 0);
  const totalUsed = accounts.reduce((s, a) => s + (bdata[a].used||0), 0);
  const totalRemain = accounts.reduce((s, a) => s + (bdata[a].remain||0), 0);
  const usedPct = totalBudget > 0 ? (totalUsed/totalBudget*100).toFixed(1) : null;

  document.getElementById('costKpiRow').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">총 예산</div>
      <div class="kpi-value">${fmtAmt(totalBudget)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">총 사용</div>
      <div class="kpi-value">${fmtAmt(totalUsed)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">잔여 예산</div>
      <div class="kpi-value">${fmtAmt(totalRemain)}</div>
    </div>`;

  const tbody = document.getElementById('costTableBody');
  if (!accounts.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="no-data">비용 데이터 없음</div></td></tr>`;
    return;
  }

  // Group by category (first part before "-")
  const grouped = {};
  for (const acct of accounts) {
    const cat = acct.split('-')[0];
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(acct);
  }

  let html = '';
  for (const [cat, accts] of Object.entries(grouped)) {
    for (const acct of accts) {
      const v = bdata[acct];
      if (!v.budget && !v.used) continue;
      const remainPct = v.budget > 0 ? v.remain/v.budget*100 : 100;
      const pctColor = remainPct < 10 ? '#e74c3c' : remainPct < 30 ? '#f39c12' : '#27ae60';
      html += `<tr>
        <td>
          <div style="font-size:12px;font-weight:600">${acct.split('-').slice(-1)[0] || acct}</div>
          <div style="font-size:10px;color:var(--text-muted)">${cat}</div>
          <div class="progress-wrap">
            <div class="progress-fill" style="width:${Math.min(v.budget>0?v.used/v.budget*100:0,100)}%;background:${pctColor}"></div>
          </div>
        </td>
        <td class="amount">${v.budget ? v.budget.toLocaleString() : '-'}</td>
        <td class="amount">${v.used ? v.used.toLocaleString() : '-'}</td>
        <td class="amount" style="color:${pctColor}">${v.remain ? v.remain.toLocaleString() : '-'}</td>
      </tr>`;
    }
  }

  tbody.innerHTML = html + `
    <tr class="total-row">
      <td><strong>합계</strong></td>
      <td class="amount">${totalBudget.toLocaleString()}</td>
      <td class="amount">${totalUsed.toLocaleString()}</td>
      <td class="amount">${totalRemain.toLocaleString()}</td>
    </tr>`;
}

//  SERVICE WORKER 등록 (캐시 버전 v2)
// ══════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      // 이전 서비스워커(v1) 강제 해제 후 새 버전 등록
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const reg of registrations) await reg.unregister();
      await navigator.serviceWorker.register('./sw.js');
    } catch(e) {
      console.warn('SW 등록 실패:', e);
    }
  });
}
